<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VÍDEOS</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --accent: #ff3c3c;
      --accent2: #ff8c00;
      --text: #f0f0f0;
      --muted: #555;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      padding: 40px 24px 20px;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: flex-end;
      gap: 16px;
    }
    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: 4px;
      line-height: 1;
      background: linear-gradient(135deg, #fff 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header span {
      font-size: 0.8em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2px;
      padding: 2px;
    }

    .card {
      background: var(--card);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 16/10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      transition: transform 0.2s;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 60%);
      z-index: 1;
    }
    .card:hover { transform: scale(1.01); z-index: 2; }

    .card-num {
      position: absolute;
      top: 16px;
      right: 16px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.5rem;
      color: rgba(255,255,255,0.08);
      z-index: 2;
      line-height: 1;
    }

    .card-content { position: relative; z-index: 2; }
    .card-titulo {
      font-size: 1.05em;
      font-weight: 500;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .card-actions { display: flex; gap: 8px; align-items: center; }

    .btn-ver {
      display: inline-block;
      padding: 7px 18px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 0.8em;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 3px;
      transition: background 0.2s;
    }
    .btn-ver:hover { background: #cc2200; }

    .btn-copy {
      padding: 7px 14px;
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      font-size: 0.8em;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .btn-copy:hover { background: #333; color: #fff; }
    .btn-copy.ok { background: #1a3a1a; color: #4f4; border-color: #4f4; }

    /* BG pattern */
    .card:nth-child(odd) { background: #111; }
    .card:nth-child(3n) { background: #0e0e0e; }

    #count {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 2px;
    }

    .empty {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-size: 1.1em;
      grid-column: 1/-1;
    }
  </style>
</head>
<body>

<header>
  <h1>VÍDEOS</h1>
  <span id="count"></span>
</header>

<div class="grid" id="grid">
  <div class="empty">Cargando...</div>
</div>

<script>
  const BASE = window.location.href.replace("index2.html","").replace(/\/$/, "") + "/watch2.html?v=";

  fetch("videos2.json")
    .then(r => r.json())
    .then(videos => {
      document.getElementById("count").textContent = videos.length + " VIDEOS";
      const grid = document.getElementById("grid");

      if (!videos.length) {
        grid.innerHTML = '<div class="empty">No hay videos aún.</div>';
        return;
      }

      grid.innerHTML = videos.map((v, i) => `
        <div class="card">
          <div class="card-num">${String(i+1).padStart(2,'0')}</div>
          <div class="card-content">
            <div class="card-titulo">${v.titulo}</div>
            <div class="card-actions">
              <a class="btn-ver" href="watch2.html?v=${v.id}">▶ Ver</a>
              <button class="btn-copy" onclick="copiar(${v.id}, this)">Copiar link</button>
            </div>
          </div>
        </div>
      `).join("");
    });

  function copiar(id, btn) {
    navigator.clipboard.writeText(BASE + id);
    btn.textContent = "¡Copiado!";
    btn.classList.add("ok");
    setTimeout(() => {
      btn.textContent = "Copiar link";
      btn.classList.remove("ok");
    }, 2000);
  }
</script>
</body>
</html>
