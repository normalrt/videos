<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ver</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a; color: #f0f0f0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    .topbar {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 16px 24px; border-bottom: 1px solid #1e1e1e;
    }
    .topbar a {
      color: #555; text-decoration: none;
      font-size: 0.85em; letter-spacing: 1px;
      text-transform: uppercase; transition: color 0.2s;
    }
    .topbar a:hover { color: #fff; }
    .topbar h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.4rem; letter-spacing: 3px; color: #ff3c3c;
    }
    #titulo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      letter-spacing: 2px; padding: 20px 24px 10px; line-height: 1.1;
    }
    #player {
      width: 100%; max-width: 960px;
      margin: 0 auto; aspect-ratio: 16/9;
      background: #000; padding: 0 16px;
    }
    #player iframe { width: 100%; height: 100%; border: none; display: block; }

    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 960px; margin: 16px auto 0;
      padding: 0 16px 30px; gap: 12px;
    }
    .nav-btn {
      padding: 10px 24px; background: #1a1a1a; color: #aaa;
      border: 1px solid #2a2a2a; font-family: 'DM Sans', sans-serif;
      font-size: 0.85em; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer;
      border-radius: 3px; transition: all 0.2s;
    }
    .nav-btn:hover:not(:disabled) { background: #ff3c3c; color: #fff; border-color: #ff3c3c; }
    .nav-btn:disabled { opacity: 0.2; cursor: default; }
    .nav-info { font-size: 0.85em; color: #444; letter-spacing: 1px; }

    .copy-btn {
      padding: 10px 20px; background: transparent; color: #555;
      border: 1px solid #2a2a2a; font-family: 'DM Sans', sans-serif;
      font-size: 0.8em; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer;
      border-radius: 3px; transition: all 0.2s;
    }
    .copy-btn:hover { color: #fff; border-color: #555; }
    .copy-btn.ok { color: #4f4; border-color: #4f4; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="index.html">← Inicio</a>
  <h2>VÍDEOS</h2>
  <button class="copy-btn" id="copyBtn" onclick="copiarLink()">Compartir</button>
</div>

<div id="titulo">Cargando...</div>
<div id="player"></div>

<div class="nav-bar">
  <button class="nav-btn" id="btnPrev" onclick="irA(-1)" disabled>← Anterior</button>
  <span class="nav-info" id="navInfo"></span>
  <button class="nav-btn" id="btnNext" onclick="irA(1)" disabled>Siguiente →</button>
</div>

<script>
  var videos = [];
  var actual = 0;
  var id = parseInt(new URLSearchParams(window.location.search).get("v"));

  fetch("videos.json")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      videos = data;
      actual = videos.findIndex(function(v) { return v.id === id; });
      if (actual === -1) actual = 0;
      cargar(actual);
    });

  function cargar(i) {
    var v = videos[i];
    document.title = v.titulo;
    document.getElementById("titulo").textContent = v.titulo;
    document.getElementById("player").innerHTML =
      '<iframe src="' + v.src + '" allowfullscreen allow="autoplay; fullscreen"></iframe>';
    document.getElementById("navInfo").textContent = (i+1) + " / " + videos.length;
    document.getElementById("btnPrev").disabled = (i === 0);
    document.getElementById("btnNext").disabled = (i === videos.length - 1);
    window.history.replaceState(null, "", "watch.html?v=" + v.id);
  }

  function irA(dir) {
    actual += dir;
    cargar(actual);
  }

  function copiarLink() {
    navigator.clipboard.writeText(window.location.href);
    var btn = document.getElementById("copyBtn");
    btn.textContent = "¡Copiado!";
    btn.classList.add("ok");
    setTimeout(function() { btn.textContent = "Compartir"; btn.classList.remove("ok"); }, 2000);
  }
</script>
</body>
</html>
